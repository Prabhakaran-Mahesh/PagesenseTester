<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main class="page">
    <section class="card" aria-labelledby="signup-title">
      <p class="mark" aria-hidden="true"></p>
      <p class="eyebrow">Lumina</p>
      <h1 id="signup-title">Create your account</h1>
      <p class="lede">One short form. You stay right here.</p>

      <form id="signup-form">
        <label class="field">
          <span>Name</span>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Ada Lovelace" required>
        </label>

        <label class="field">
          <span>Email</span>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="ada@example.com" required>
        </label>

        <label class="field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
        </label>

        <button type="submit">Create account</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
